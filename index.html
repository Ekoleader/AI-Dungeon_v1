<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the game use the whole iPad screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- These let you "Add to Home Screen" on the iPad and open it full-screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="First Quest">
  <meta name="theme-color" content="#141a2e">
  <title>First Quest</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Main menu">🐉 <span>First Quest</span></button>
    <nav>
      <button class="top-btn" id="voice-btn" data-action="toggle-voice" aria-label="Narrator voice on or off">🔊</button>
      <button class="top-btn" data-action="pip-open">🦉 <span>Ask Pip</span></button>
      <button class="top-btn" data-action="badges">🏅 <span>Badges</span> <b id="badge-count"></b></button>
      <button class="top-btn" data-action="settings" aria-label="Settings">⚙️</button>
    </nav>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card parchment">
      <button class="modal-close" data-action="close-modal" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <!-- Order matters: data first, then the pieces that use it, then the app. -->
  <script src="js/data.js"></script>
  <script src="js/adventures.js"></script>
  <script src="js/state.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/narrator.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
